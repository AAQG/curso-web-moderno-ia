<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista de tareas moderna y minimalista creada con HTML, CSS y JavaScript">
    <title>Lista de Tareas - Todo App</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: rgba(22, 29, 45, 0.75);
            --bg-item: rgba(30, 41, 59, 0.65);
            --bg-item-hover: rgba(51, 65, 85, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.4);
            
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.12);
            --danger-hover: #dc2626;

            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 22px;
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 60px -15px rgba(99, 102, 241, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .app-container {
            width: 100%;
            max-width: 580px;
        }

        .todo-card {
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: var(--shadow-card);
            transition: transform 0.2s ease;
        }

        /* Header */
        .todo-header {
            margin-bottom: 28px;
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 12px;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        .todo-header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .todo-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Formulario */
        .todo-form {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-group {
            position: relative;
            flex: 1;
        }

        .todo-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .todo-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background: rgba(15, 23, 42, 0.95);
        }

        .todo-input::placeholder {
            color: var(--text-dim);
        }

        .btn-add {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            padding: 14px 22px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-add:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
            filter: brightness(1.08);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        /* Barra de filtros y acciones */
        .todo-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            gap: 4px;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .filter-btn:hover {
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .btn-clear {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .btn-clear:hover {
            color: var(--danger);
            background: var(--danger-bg);
        }

        /* Lista de tareas */
        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 120px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Scrollbar personalizada */
        .todo-list::-webkit-scrollbar {
            width: 6px;
        }
        .todo-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .todo-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
        }
        .todo-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .todo-item {
            background: var(--bg-item);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 13px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.2s ease;
            animation: fadeIn 0.25s ease-out forwards;
        }

        .todo-item:hover {
            background: var(--bg-item-hover);
            border-color: var(--border-hover);
            transform: translateX(2px);
        }

        .todo-content {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            cursor: pointer;
            user-select: none;
        }

        /* Checkbox personalizado */
        .custom-checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            background: rgba(15, 23, 42, 0.5);
        }

        .custom-checkbox svg {
            width: 14px;
            height: 14px;
            stroke: #ffffff;
            stroke-width: 3;
            fill: none;
            opacity: 0;
            transform: scale(0.6);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .todo-item.completed .custom-checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .todo-item.completed .custom-checkbox svg {
            opacity: 1;
            transform: scale(1);
        }

        .todo-text {
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.2s ease;
            word-break: break-word;
        }

        .todo-item.completed .todo-text {
            color: var(--text-dim);
            text-decoration: line-through;
        }

        /* Botón eliminar */
        .btn-delete {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 6px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: all 0.2s ease;
        }

        .todo-item:hover .btn-delete {
            opacity: 1;
        }

        .btn-delete:hover {
            color: var(--danger);
            background: var(--danger-bg);
            transform: scale(1.08);
        }

        .btn-delete svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* Estado vacío */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 38px 16px;
            text-align: center;
            color: var(--text-dim);
            gap: 12px;
        }

        .empty-state svg {
            width: 44px;
            height: 44px;
            stroke: var(--text-dim);
            stroke-width: 1.5;
            opacity: 0.7;
        }

        .empty-state p {
            font-size: 0.92rem;
        }

        /* Footer */
        .todo-footer {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(0.95);
            }
        }

        /* Responsividad */
        @media (max-width: 480px) {
            .todo-card {
                padding: 24px 20px;
            }

            .todo-form {
                flex-direction: column;
            }

            .btn-add {
                justify-content: center;
            }

            .todo-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                justify-content: center;
            }

            .btn-clear {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <main class="app-container">
        <section class="todo-card">
            <!-- Encabezado -->
            <header class="todo-header">
                <span class="badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    Organizador Diario
                </span>
                <h1>Mi Lista de Tareas</h1>
                <p>Mantén tus metas claras y organiza tu productividad.</p>
            </header>

            <!-- Formulario de ingreso -->
            <form id="form-tarea" class="todo-form">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="tarea-input" 
                        class="todo-input"
                        placeholder="¿Qué tarea tienes pendiente?" 
                        required 
                        autocomplete="off"
                        aria-label="Nueva tarea"
                    >
                </div>
                <button type="submit" id="btn-agregar" class="btn-add">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Agregar
                </button>
            </form>

            <!-- Barra de Filtros -->
            <div class="todo-toolbar">
                <div class="filter-group" role="tablist">
                    <button type="button" class="filter-btn active" data-filter="todas" id="filter-todas">Todas</button>
                    <button type="button" class="filter-btn" data-filter="pendientes" id="filter-pendientes">Pendientes</button>
                    <button type="button" class="filter-btn" data-filter="completadas" id="filter-completadas">Completadas</button>
                </div>
                <button type="button" id="btn-limpiar" class="btn-clear">Limpiar completadas</button>
            </div>

            <!-- Lista de Tareas -->
            <ul id="lista-tareas" class="todo-list" aria-label="Lista de tareas">
                <!-- Se llena dinámicamente con JS -->
            </ul>

            <!-- Pie de la aplicación -->
            <footer class="todo-footer">
                <span id="contador-tareas">0 tareas pendientes</span>
                <span>Almacenamiento local activo</span>
            </footer>
        </section>
    </main>

    <!-- Lógica en JavaScript -->
    <script>
        // Elementos del DOM
        const formTarea = document.getElementById('form-tarea') || document.getElementById('from-tarea');
        const tareaInput = document.getElementById('tarea-input');
        const listaTareas = document.getElementById('lista-tareas');
        const contadorTareas = document.getElementById('contador-tareas');
        const btnLimpiar = document.getElementById('btn-limpiar');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // Clave para almacenamiento en LocalStorage
        const STORAGE_KEY = 'todolist_moderno_ia';

        // Estado de la aplicación
        let tareas = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
            { id: 1, texto: 'Explorar la aplicación de tareas', completada: true },
            { id: 2, texto: 'Crear una nueva meta para hoy', completada: false }
        ];
        let filtroActual = 'todas';

        // Guardar en LocalStorage
        function guardarEnLocalStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tareas));
        }

        // Renderizar la lista de tareas según el filtro
        function renderizarTareas() {
            listaTareas.innerHTML = '';

            const tareasFiltradas = tareas.filter(tarea => {
                if (filtroActual === 'pendientes') return !tarea.completada;
                if (filtroActual === 'completadas') return tarea.completada;
                return true; // 'todas'
            });

            if (tareasFiltradas.length === 0) {
                const mensajeVacio = filtroActual === 'completadas' 
                    ? 'No hay tareas completadas todavía.' 
                    : filtroActual === 'pendientes'
                    ? '¡Genial! No tienes tareas pendientes.'
                    : 'No tienes tareas registradas. ¡Agrega una nueva arriba!';

                listaTareas.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <p>${mensajeVacio}</p>
                    </div>
                `;
            } else {
                tareasFiltradas.forEach(tarea => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${tarea.completada ? 'completed' : ''}`;
                    li.dataset.id = tarea.id;

                    li.innerHTML = `
                        <div class="todo-content" onclick="toggleTarea(${tarea.id})">
                            <div class="custom-checkbox" aria-label="Marcar como completada">
                                <svg viewBox="0 0 24 24">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                            <span class="todo-text">${escapeHTML(tarea.texto)}</span>
                        </div>
                        <button class="btn-delete" onclick="eliminarTarea(${tarea.id})" title="Eliminar tarea" aria-label="Eliminar tarea">
                            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                        </button>
                    `;
                    listaTareas.appendChild(li);
                });
            }

            actualizarContador();
        }

        // Actualizar contador de tareas pendientes
        function actualizarContador() {
            const pendientes = tareas.filter(t => !t.completada).length;
            contadorTareas.textContent = `${pendientes} ${pendientes === 1 ? 'tarea pendiente' : 'tareas pendientes'}`;
        }

        // Agregar una nueva tarea
        function agregarTarea(e) {
            e.preventDefault();
            const texto = tareaInput.value.trim();
            if (!texto) return;

            const nuevaTarea = {
                id: Date.now(),
                texto: texto,
                completada: false
            };

            tareas.unshift(nuevaTarea);
            guardarEnLocalStorage();
            renderizarTareas();

            tareaInput.value = '';
            tareaInput.focus();
        }

        // Cambiar estado completada/pendiente
        window.toggleTarea = function(id) {
            tareas = tareas.map(tarea => {
                if (tarea.id === id) {
                    return { ...tarea, completada: !tarea.completada };
                }
                return tarea;
            });
            guardarEnLocalStorage();
            renderizarTareas();
        };

        // Eliminar tarea
        window.eliminarTarea = function(id) {
            const itemElement = document.querySelector(`.todo-item[data-id="${id}"]`);
            if (itemElement) {
                itemElement.style.animation = 'fadeOut 0.2s ease forwards';
                setTimeout(() => {
                    tareas = tareas.filter(tarea => tarea.id !== id);
                    guardarEnLocalStorage();
                    renderizarTareas();
                }, 180);
            } else {
                tareas = tareas.filter(tarea => tarea.id !== id);
                guardarEnLocalStorage();
                renderizarTareas();
            }
        };

        // Limpiar todas las tareas completadas
        btnLimpiar.addEventListener('click', () => {
            const tareasCompletadas = tareas.some(t => t.completada);
            if (!tareasCompletadas) return;

            tareas = tareas.filter(tarea => !tarea.completada);
            guardarEnLocalStorage();
            renderizarTareas();
        });

        // Configuración de botones de filtro
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filtroActual = btn.dataset.filter;
                renderizarTareas();
            });
        });

        // Prevenir inyección de HTML en textos de usuarios
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Event listener del formulario
        formTarea.addEventListener('submit', agregarTarea);

        // Renderizado inicial al cargar
        document.addEventListener('DOMContentLoaded', renderizarTareas);
        renderizarTareas();
    </script>
</body>
</html>
